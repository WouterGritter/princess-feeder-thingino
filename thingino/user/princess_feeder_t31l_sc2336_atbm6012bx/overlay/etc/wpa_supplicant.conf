ctrl_interface=/run/wpa_supplicant
update_config=1

# Your Wi-Fi (2.4 GHz). Generate the psk line with:
#   wpa_passphrase "YOUR_SSID" "YOUR_PASSWORD"
# and paste its hex psk= line below (no quotes around the hex).
# scan_ssid=1 is only needed for a hidden SSID, but doesn't hurt.
network={
	ssid="YOUR_SSID"
	psk=PASTE_THE_64_HEX_CHARACTER_PSK_HERE
	scan_ssid=1
}
