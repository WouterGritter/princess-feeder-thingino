# feederd config: key=value, one per line. Unknown keys are an error.

# Your MQTT broker (hostname or IP). Required.
mqtt_host=
mqtt_port=1883
# Leave both empty for a broker without authentication.
mqtt_user=
mqtt_pass=
mqtt_client_id=pet-feeder
# Every topic lives under this prefix: <root_topic>/feed, <root_topic>/led, ...
root_topic=home/pet-feeder
# The most portions a single MQTT feed may ask for (1..50).
max_portions=20
# What led=idle means, and the LED state at startup: off, on, slow_blink, fast_blink
led_idle=off
# portions-today resets at this local hour, so after-midnight snacks count as yesterday.
day_reset_hour=4
